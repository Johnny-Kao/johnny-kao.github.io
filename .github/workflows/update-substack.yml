name: Update Substack Content

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: substack-content-update
  cancel-in-progress: false

jobs:
  update-substack-content:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip substack]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Fetch Substack JSON from Worker
        run: |
          mkdir -p .cache
          curl --fail --silent --show-error --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            -H "Accept: application/json, text/plain;q=0.9, */*;q=0.8" \
            "https://substack-feed-worker.at12885.workers.dev/substack.json?cache_bust=$(date +%s)" \
            -o .cache/substack-feed.json

      - name: Verify Worker feed freshness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            -H "Accept: application/json, text/plain;q=0.9, */*;q=0.8" \
            "https://substack-feed-worker.at12885.workers.dev/meta?cache_bust=$(date +%s)" \
            -o .cache/substack-meta.json
          test "$(wc -c < .cache/substack-feed.json)" -le 2097152
          test "$(wc -c < .cache/substack-meta.json)" -le 65536
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const [items, meta] = await Promise.all([
              readFile(".cache/substack-feed.json", "utf8").then(JSON.parse),
              readFile(".cache/substack-meta.json", "utf8").then(JSON.parse)
            ]);
            if (!Array.isArray(items) || items.length === 0) throw new Error("Worker returned no Substack items.");
            const ageMs = Date.now() - Date.parse(meta.updatedAt);
            if (!Number.isFinite(ageMs) || ageMs > 36 * 60 * 60 * 1000) {
              throw new Error(`Worker feed is stale: ${meta.updatedAt || "missing update time"}`);
            }
          '

      - name: Generate substack.json
        env:
          SUBSTACK_FEED_FILE: .cache/substack-feed.json
          SUBSTACK_JSON_URL: https://substack-feed-worker.at12885.workers.dev/substack.json
        run: node scripts/generate-substack-json.js

      - name: Merge article archive
        run: node scripts/merge-articles-archive.js

      - name: Render articles into index.html
        run: node scripts/render-articles-into-index.js

      - name: Render article archive page
        run: node scripts/render-articles-archive-page.js

      - name: Detect content changes
        id: changes
        run: |
          if git diff --quiet -- data/substack.json data/articles-archive.json index.html articles/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update sitemap lastmod
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/update-sitemap-lastmod.js

      - name: Notify IndexNow
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/notify-indexnow.js

      - name: Update substack sync meta
        env:
          CONTENT_CHANGED: ${{ steps.changes.outputs.changed }}
          SUBSTACK_JSON_URL: https://substack-feed-worker.at12885.workers.dev/substack.json
        run: node scripts/update-substack-sync-meta.js

      - name: Commit and push changes
        run: |
          set -euo pipefail
          allowed_files=(data/substack.json data/articles-archive.json index.html articles/index.html sitemap.xml data/substack-sync.json)
          unexpected_files=$(git diff --name-only -- "${allowed_files[@]}"; git diff --name-only | grep -v -E '^(data/substack\.json|data/articles-archive\.json|index\.html|articles/index\.html|sitemap\.xml|data/substack-sync\.json)$' || true)
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi
          changed_count=$(git diff --name-only | wc -l | tr -d ' ')
          [ "$changed_count" -le 6 ]

          if git diff --quiet -- data/substack.json data/articles-archive.json index.html articles/index.html sitemap.xml data/substack-sync.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/substack.json data/articles-archive.json index.html articles/index.html sitemap.xml data/substack-sync.json
          git commit -m "chore: update substack content [skip substack]"
          git push
